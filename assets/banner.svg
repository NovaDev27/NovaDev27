<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Jose Henrique — NovaDev27">
  <defs>
    <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset=".55" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#c4f25a"/>
    </linearGradient>
    <radialGradient id="core" cx=".36" cy=".3" r=".78">
      <stop offset="0" stop-color="#fff"/>
      <stop offset=".28" stop-color="#ddd6fe"/>
      <stop offset=".7" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#3b1a8a"/>
    </radialGradient>
    <radialGradient id="glow">
      <stop offset=".4" stop-color="#8b5cf6" stop-opacity=".5"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#fff" fill-opacity=".06"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="320" rx="24"/></clipPath>
    <style>
      .float { animation: float 6s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
      .blob1 { animation: drift 14s ease-in-out infinite alternate; }
      .blob2 { animation: drift 18s ease-in-out infinite alternate-reverse; }
      .eye { animation: blink 5s infinite; transform-origin: center; transform-box: fill-box; }
      .type { animation: reveal 1.4s steps(28) .3s both; }
      @keyframes float { 50% { transform: translateY(-8px); } }
      @keyframes drift { to { transform: translate(-60px, 30px); } }
      @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
      @keyframes reveal { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="#08070d"/>
    <circle class="blob1" cx="980" cy="40" r="200" fill="#8b5cf6" opacity=".35" filter="url(#blur)"/>
    <circle class="blob2" cx="420" cy="360" r="220" fill="#22d3ee" opacity=".16" filter="url(#blur)"/>
    <circle cx="760" cy="200" r="90" fill="#c4f25a" opacity=".08" filter="url(#blur)"/>
    <rect width="1200" height="320" fill="url(#dots)"/>
    <rect x=".5" y=".5" width="1199" height="319" rx="24" fill="none" stroke="#fff" stroke-opacity=".08"/>

    <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
      <text x="72" y="96" fill="#a9a6bd" font-size="18" letter-spacing="6" font-weight="600">OLÁ, EU SOU</text>
      <text x="72" y="168" fill="#eeedf6" font-size="66" font-weight="800" letter-spacing="-1.5">Jose Henrique</text>
      <g class="type">
        <text x="72" y="214" fill="url(#aurora)" font-size="26" font-weight="700">Vibe coding com IA · produtos que conversam</text>
      </g>
      <text x="72" y="262" fill="#6d6a82" font-size="16" font-family="Consolas, 'Cascadia Code', monospace">@NovaDev27  ✦  estudante EAD  ✦  TypeScript · React · IA</text>
    </g>

    <g transform="translate(940 160)">
      <circle r="120" fill="url(#glow)"/>
      <g class="float">
        <ellipse rx="104" ry="32" fill="none" stroke="url(#aurora)" stroke-width="3" transform="rotate(-20)"/>
        <g transform="rotate(-20)">
          <circle r="4" fill="#ddd6fe">
            <animateMotion dur="7s" repeatCount="indefinite" path="M -104 0 A 104 32 0 1 0 104 0 A 104 32 0 1 0 -104 0"/>
          </circle>
        </g>
        <circle r="62" fill="url(#core)"/>
        <ellipse cx="-20" cy="-30" rx="18" ry="10" fill="#fff" opacity=".35" transform="rotate(-25 -20 -30)"/>
        <rect class="eye" x="-27" y="-14" width="15" height="26" rx="7.5" fill="#120f1f"/>
        <rect class="eye" x="12" y="-14" width="15" height="26" rx="7.5" fill="#120f1f"/>
      </g>
    </g>
  </g>
</svg>
